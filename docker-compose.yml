# Cloud AOS: local development and testing (PLAN.md section 4.6.2).
#
#   docker compose up -d web
#       Cloud AOS on http://localhost:8180 with sample data (no database needed).
#
#   docker compose --profile mysql up -d
#       Also starts MySQL loaded with a RESTORED COPY of the client's databases
#       (put the *.sql backups in ./database/restore) and Adminer on :8080.
#       Set DATABASE_HOST=db and the other values in .env (see .env.example).
#
# In staging and production there is no database container: Cloud AOS points at the
# client's existing MySQL server through DATABASE_HOST, with a least-privilege account.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud_aos_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8180
      HOSTNAME: "0.0.0.0"
      # Leave DATABASE_HOST empty to run on sample data.
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      # Read-only until a module has passed its parity tests (PLAN.md section 8.3).
      DATABASE_ALLOW_WRITES: ${DATABASE_ALLOW_WRITES:-false}
      DB_JCS: ${DB_JCS:-jcs}
      DB_APF: ${DB_APF:-apf}
      DB_CHEMAG: ${DB_CHEMAG:-chemag}
      DB_BFI: ${DB_BFI:-bfi}
      DB_BFI_ADMIN: ${DB_BFI_ADMIN:-bfi_admin}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Optional Redis (docker compose --profile redis up -d): REDIS_URL=redis://redis:6379/0
      REDIS_URL: ${REDIS_URL:-}
      CACHE_READS: ${CACHE_READS:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-15}
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8180/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloud_aos

  # Optional: Redis for the read cache, rate limits, idempotency and jobs across instances.
  #   docker compose --profile redis up -d   and set REDIS_URL=redis://redis:6379/0 for web.
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: cloud_aos_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - cloud_aos

  # Development only: MySQL with a restored backup of jcs / apf / chemag / bfi / bfi_admin.
  db:
    profiles: ["mysql"]
    image: mysql:8.0 # match the client's server version (5.7 or 8.0) from the schema dump
    container_name: cloud_aos_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/restore:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_aos

  # Development only: browser-based database viewer.
  adminer:
    profiles: ["mysql"]
    image: adminer:4.8.1
    container_name: cloud_aos_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - cloud_aos

networks:
  cloud_aos:
    driver: bridge

volumes:
  mysqldata:
    driver: local
