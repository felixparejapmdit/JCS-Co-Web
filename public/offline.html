<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud AOS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Shown by the service worker when the server cannot be reached. Self-contained on
       purpose: no scripts or stylesheets to download, so it works with no connection. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: #0b1220; color: #e2e8f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%; max-width: 440px; padding: 32px; text-align: center;
      background: #111a2e; border: 1px solid #1e2a44; border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center;
      border-radius: 16px; border: 1px solid rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); color: #fcd34d;
    }
    h1 { margin: 0 0 8px; font-size: 24px; color: #fff; letter-spacing: -0.01em; }
    p { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #94a3b8; }
    .actions { display: flex; flex-direction: column; gap: 12px; }
    button, a {
      display: block; width: 100%; padding: 12px 16px; border-radius: 12px;
      font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.2; text-decoration: none; cursor: pointer;
    }
    button { border: 0; background: #0d9488; color: #fff; }
    button:hover { background: #14b8a6; }
    a { border: 1px solid #2a3a5c; color: #cbd5e1; font-weight: 500; }
    a:hover { background: rgba(255, 255, 255, 0.05); }
    footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid #1e2a44; font-size: 12px; color: #64748b; }
    footer b { color: #2dd4bf; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" /><path d="M8.5 16.43a5 5 0 0 1 7 0" /><path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.86a10 10 0 0 0-2-1.39" /><path d="M2 8.82a15 15 0 0 1 4.18-2.65" /><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
        <path d="m2 2 20 20" />
      </svg>
    </div>
    <h1>Cannot reach Cloud AOS</h1>
    <p>
      The server is not responding. Check your connection and try again. If it keeps happening, ask your
      system administrator whether the Cloud AOS server is running. Anything you already saved is safe on the server.
    </p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/dashboard">Go to Home</a>
    </div>
    <footer>Cloud <b>AOS</b></footer>
  </main>
</body>
</html>
